<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f1eb">
<meta name="description" content="Nikhil, AI/ML Engineer. Download contact details or connect directly.">
<title>Nikhil | AI/ML Engineer</title>
<style>
:root{--paper:#f3f1eb;--ink:#172321;--muted:#66716d;--line:#d9ded8;--green:#176b53;--green-dark:#105541;--coral:#e6785c;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background-color:var(--paper);background-image:radial-gradient(#52665b17 .8px,transparent .8px);background-size:15px 15px;color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:14px}
.wrap{width:min(100%,480px);margin:auto}
.card{overflow:hidden;border:1px solid #d6d8d0;border-radius:4px;background:var(--white);box-shadow:0 16px 42px #26342b1c;animation:arrive .55s ease-out both}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;text-align:left;padding:13px 17px;background:#173b34;color:var(--white)}
.hero:after{content:"";position:absolute;z-index:-1;width:190px;height:190px;right:-68px;top:-104px;border:1px solid #ffffff30;border-radius:50%;box-shadow:0 0 0 20px #ffffff08,0 0 0 42px #ffffff06}
.mark{height:52px;width:52px;margin:0 13px 0 0;border:1px solid #e9c675;border-radius:50%;display:grid;place-items:center;flex:none;color:#f3d58e;font-size:27px;font-weight:700;box-shadow:inset 0 0 0 4px #ffffff0a}
.identity{min-width:0}
h1{margin:0;font-size:27px;line-height:1.05;font-weight:600}
.kicker{margin:5px 0 0;color:#f0ce82;font:700 9px/1.4 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.content{padding:13px 16px 10px}
.intro{text-align:center;color:var(--muted);font:12px/1.45 Arial,sans-serif;margin:0 0 10px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
a.btn{min-height:41px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:4px;text-decoration:none;font:700 11px/1.2 Arial,sans-serif;border:1px solid var(--line);color:var(--ink);background:#fff;transition:transform .16s ease,border-color .16s ease,background .16s ease}
a.btn:hover{transform:translateY(-2px);border-color:#9daea4;background:#f8faf7}
a.btn:focus-visible,.detail:focus-visible{outline:3px solid #e6785c;outline-offset:3px}
a.btn.primary{grid-column:1/-1;background:var(--green);color:#fff;border-color:var(--green);min-height:43px;font-size:12px}
a.btn.primary:hover{background:var(--green-dark)}
.btn svg{width:18px;height:18px;flex:none}
.btn.whatsapp svg{color:#18875e}
.btn.linkedin svg{color:#0a66c2}
.btn.instagram svg{color:#c24475}
.section-title{margin:12px 0 5px;color:var(--muted);font:700 9px/1.4 Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.detail{display:flex;align-items:center;gap:7px;padding:7px 4px;text-decoration:none;color:var(--ink);min-width:0;border-bottom:1px solid var(--line)}
.detail:nth-last-child(-n+2){border-bottom:0}
.icon{width:27px;height:27px;display:grid;place-items:center;flex:none;border-radius:50%;background:#e9f2ed;color:var(--green)}
.icon svg{width:14px;height:14px}
.label{display:block;font:700 8px/1.3 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.value{display:block;font:11px/1.3 Arial,sans-serif;overflow-wrap:anywhere}
.detail-arrow{display:none}
.footer{text-align:center;color:#75817b;font:10px/1.4 Arial,sans-serif;padding:7px 12px 9px}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:360px){body{padding:9px}.content{padding:11px 12px 8px}.actions{gap:5px}a.btn{font-size:10px;padding-inline:4px}.detail{gap:5px;padding:6px 2px}.value{font-size:10px}}
@media(min-width:700px){
  body{padding:28px}
  .wrap{width:min(100%,900px)}
  .card{display:grid;grid-template-columns:minmax(230px,.72fr) 1.5fr;grid-template-rows:1fr auto}
  .hero{grid-column:1;grid-row:1/3;flex-direction:column;justify-content:center;text-align:center;padding:32px 22px}
  .mark{height:70px;width:70px;margin:0 0 14px;font-size:36px}
  h1{font-size:36px}
  .kicker{font-size:9px}
  .content{grid-column:2;grid-row:1;padding:25px 30px 15px;align-self:center}
  .intro{font-size:13px;margin-bottom:13px}
  .actions{gap:8px}
  a.btn{min-height:43px;font-size:11px}
  .section-title{margin-top:16px}
  .detail{padding:8px 5px}
  .value{font-size:12px}
  .detail-arrow{display:block}
  .footer{grid-column:2;grid-row:2;border-top:1px solid var(--line);padding:10px 16px}
}
</style>
</head>
