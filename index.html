<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Siddharth Macker | Advocate, Supreme Court</title>
<meta name="description" content="Siddharth Macker, Advocate, Supreme Court of India. Expert in Labour Laws. Partner, Shakti Legal Compliance India.">

<meta property="og:title" content="Siddharth Macker | Advocate, Supreme Court">
<meta property="og:description" content="Expert in Labour Laws · Partner, Shakti Legal Compliance India">

<style>
:root{
  --bg:#0b0a08;--card:#14120f;--card-2:#1b1814;--line:#2c271f;
  --gold:#c9a45c;--gold-soft:#e3c98f;--gold-dim:#8a7140;
  --text:#f3ede2;--muted:#a59a88;--focus:#e3c98f;
  --pad:10px;--row:50px;--gap:6px;--ic:34px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;display:grid;place-items:center;
  padding:var(--pad);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 18%,#c9a45c1f 0,transparent 32%),
    radial-gradient(circle at 88% 82%,#8a5a2a1c 0,transparent 36%);
}

/* One rectangle that always fits the screen: no scrolling */
.card{
  width:min(100%,440px);height:100%;max-height:820px;
  display:flex;flex-direction:column;overflow:hidden;border-radius:20px;background:var(--card);
  border:1px solid var(--line);box-shadow:0 30px 70px #000000a8,0 0 0 1px #c9a45c14 inset;
  animation:arrive .6s ease-out both;
}

/* ---------- Photo + identity ---------- */
.hero{position:relative;flex:1 1 auto;min-height:150px;background:#1a1510;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block}
/* dark scrim under the name so text stays readable on the photo */
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#0b0a08b3 62%,#0b0a08f2 86%,var(--card) 100%)}
.identity{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:0 18px 12px;text-align:center}
h1{margin:0;font:700 36px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em;color:#fff;text-shadow:0 2px 14px #000,0 1px 2px #000}
.role{margin:7px 0 0;font:600 13.5px/1.45 Inter,sans-serif;color:#f1dcaa;text-shadow:0 1px 8px #000,0 1px 2px #000}
.role b{font-weight:600;white-space:nowrap}
.role span{color:var(--gold);padding:0 6px}

/* ---------- Details ---------- */
.content{flex:none;padding:4px 14px 14px}
.firm{
  display:flex;align-items:center;gap:11px;margin:0 0 var(--gap);padding:8px 12px;border-radius:13px;
  text-decoration:none;color:var(--text);background:linear-gradient(135deg,#c9a45c24,#c9a45c0a);
  border:1px solid #c9a45c4d;transition:border-color .18s ease,transform .18s ease;
}
.firm:hover{border-color:var(--gold);transform:translateY(-1px)}
.firm .seal{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;background:#fbf8f1;border:1px solid var(--gold);padding:5px}
.firm .seal img{width:100%;height:100%;object-fit:contain;display:block}
.firm .txt{min-width:0;flex:1}
.firm small{display:block;color:var(--muted);font:600 9px/1.3 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.firm strong{display:block;margin-top:2px;font:600 14px/1.25 Inter,sans-serif}
.firm em{display:block;margin-top:1px;font-style:normal;color:var(--gold);font-size:11.5px}
.firm .go{color:var(--gold);font-size:20px;flex:none}

.contacts{display:grid;gap:var(--gap)}
.contact{
  display:flex;align-items:center;gap:11px;min-height:var(--row);padding:6px 12px;border-radius:13px;
  text-decoration:none;color:var(--text);background:var(--card-2);border:1px solid var(--line);
  transition:border-color .18s ease,background .18s ease,transform .18s ease;
}
.contact:hover{border-color:#c9a45c66;background:#211d17;transform:translateY(-1px)}
.contact:active{transform:scale(.99)}
.contact[hidden]{display:none}
.ic{width:var(--ic);height:var(--ic);flex:none;display:grid;place-items:center;border-radius:10px;background:#c9a45c1a;color:var(--gold-soft)}
.ic svg{width:18px;height:18px}
.contact .txt{min-width:0;flex:1}
.label{display:block;color:var(--muted);font:600 9.5px/1.2 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.value{display:block;margin-top:2px;font:500 14.5px/1.25 Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{flex:none;padding:6px 11px;border-radius:999px;border:1px solid #c9a45c55;color:var(--gold-soft);font:600 11px/1 Inter,sans-serif;letter-spacing:.04em}
.contact.primary{background:linear-gradient(135deg,#c9a45c,#a9823d);border-color:transparent;color:#17120a}
.contact.primary .ic{background:#17120a1f;color:#17120a}
.contact.primary .label{color:#3a2c12}
.contact.primary .value{font-weight:600}
.contact.primary .cta{border-color:#17120a55;color:#17120a}
.contact.primary:hover{background:linear-gradient(135deg,#d6b26a,#b48c44)}

a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* phones */
@media(max-width:419px){
  .role b{display:block}.role span{display:none}
  .contact .cta{display:none}
}
/* short screens: tighten everything so it still fits */
@media(max-height:700px){
  :root{--row:44px;--gap:5px;--ic:30px}
  h1{font-size:31px}
  .role{font-size:12.5px;margin-top:5px}
  .identity{padding-bottom:8px}
  .firm{padding:6px 10px}
  .firm .seal{width:34px;height:34px}
  .firm strong{font-size:13px}
  .value{font-size:13.5px}
  .ic svg{width:16px;height:16px}
}
@media(max-height:580px){
  :root{--row:40px;--gap:4px;--ic:28px;--pad:6px}
  .firm em{display:none}
  .label{font-size:8.5px}
  h1{font-size:28px}
}

/* wide screens & phones held sideways: landscape rectangle, photo on the left */
@media(min-width:640px) and (min-aspect-ratio:1/1){
  :root{--pad:24px}
  .card{width:min(100%,960px);height:auto;max-height:100%;aspect-ratio:16/10;flex-direction:row}
  .hero{flex:0 0 42%;min-height:0}
  .hero:after{background:linear-gradient(180deg,transparent 40%,#0b0a08bf 70%,#0b0a08f2 100%)}
  .identity{text-align:left;padding:0 24px 22px}
  .role b{display:inline}.role span{display:inline}
  h1{font-size:clamp(28px,4.2vw,46px)}
  .content{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,3vw,34px)}
  .contact .cta{display:block}
}
@media(min-width:640px) and (min-aspect-ratio:1/1) and (max-height:520px){
  :root{--pad:8px}
  .card{aspect-ratio:auto;height:100%}
  .hero{flex-basis:36%}
  .role b{display:block}.role span{display:none}
  .identity{padding:0 16px 12px}
  .contact .cta{display:none}
}
@media(min-width:640px) and (min-aspect-ratio:1/1) and (min-height:600px){
  :root{--row:58px;--gap:9px;--ic:40px}
  .value{font-size:16px}
  .label{font-size:10px}
  .firm{padding:12px 14px;margin-bottom:14px}
  .firm .seal{width:46px;height:46px}
  .firm strong{font-size:15.5px}
}
</style>
</head>
<body>
<article class="card">
  <header class="hero">
    <img src="siddharth-macker.webp" alt="Siddharth Macker, Advocate" width="1178" height="1335">
    <div class="identity">
      <h1>Siddharth Macker</h1>
      <p class="role"><b>Advocate, Supreme Court</b><span>|</span><b>Expert in Labour Laws</b></p>
    </div>
  </header>

  <main class="content">
    <a class="firm" href="https://www.slci.in" target="_blank" rel="noopener noreferrer" aria-label="Partner with Shakti Legal Compliance India, open www.slci.in">
      <span class="seal" aria-hidden="true"><img src="slci-logo.png" alt="" width="256" height="256"></span>
      <span class="txt">
        <small>Partner</small>
        <strong>Shakti Legal Compliance India</strong>
        <em>www.slci.in</em>
      </span>
      <span class="go" aria-hidden="true">›</span>
    </a>

    <div class="contacts" aria-label="Contact">
      <a class="contact primary" id="c-mobile" hidden>
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-3 2a15 15 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2C10 20 4 14 3 6a2 2 0 0 1 2-2Z"/></svg></span>
        <span class="txt"><span class="label">Mobile</span><span class="value"></span></span>
        <span class="cta">Call</span>
      </a>
      <a class="contact" id="c-whatsapp" target="_blank" rel="noopener noreferrer" hidden>
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20l1.2-4.4A8.5 8.5 0 1 1 20 11.5Z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .9c-1.2-.5-2.3-1.6-2.8-2.8l.9-1-1-2Z"/></svg></span>
        <span class="txt"><span class="label">WhatsApp</span><span class="value"></span></span>
        <span class="cta">Chat</span>
      </a>
      <a class="contact" id="c-linkedin" target="_blank" rel="noopener noreferrer" hidden>
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.2 3.5a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4ZM3.3 9.5h3.8v11H3.3v-11Zm6.1 0H13v1.5h.1c.5-.9 1.7-1.9 3.5-1.9 3.7 0 4.4 2.4 4.4 5.5v5.9h-3.8v-5.2c0-1.2 0-2.8-1.8-2.8s-2.1 1.3-2.1 2.7v5.3H9.4v-11Z"/></svg></span>
        <span class="txt"><span class="label">LinkedIn</span><span class="value"></span></span>
        <span class="cta">Connect</span>
      </a>
      <a class="contact" id="c-instagram" target="_blank" rel="noopener noreferrer" hidden>
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
        <span class="txt"><span class="label">Instagram</span><span class="value"></span></span>
        <span class="cta">Follow</span>
      </a>
      <a class="contact" id="c-email" hidden>
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span>
        <span class="txt"><span class="label">Email</span><span class="value"></span></span>
        <span class="cta">Write</span>
      </a>
    </div>
  </main>

</article>

<script>
/* ===== CONTACT DETAILS — edit only this block =====
   Leave a value empty ("") to hide that row on the card.
   Numbers: 10-digit Indian mobile, e.g. "9876543210". */
const CONTACT = {
  mobile:    "9999488941",
  whatsapp:  "9999488941",
  linkedin:  "https://www.linkedin.com/in/siddharth-macker-273a77167",   // full profile URL, e.g. "https://www.linkedin.com/in/username"
  instagram: "labourlawwithsiddharth",   // username without @, e.g. "siddharthmacker"
  email:     "siddharth@slci.in"
};
/* ================================================== */

const digits = n => n.replace(/\D/g, "").replace(/^(91)?(\d{10})$/, "$2");
const pretty = n => "+91 " + n.slice(0, 5) + " " + n.slice(5);
const rows = {
  mobile:    v => ({ href: "tel:+91" + digits(v), text: pretty(digits(v)) }),
  whatsapp:  v => ({ href: "https://wa.me/91" + digits(v), text: pretty(digits(v)) }),
  linkedin:  v => ({ href: v, text: "Siddharth Macker" }),
  instagram: v => ({ href: "https://www.instagram.com/" + v.replace(/^@/, ""), text: "@" + v.replace(/^@/, "") }),
  email:     v => ({ href: "mailto:" + v, text: v })
};
for (const key in rows) {
  const value = (CONTACT[key] || "").trim();
  if (!value) continue;
  const el = document.getElementById("c-" + key);
  const { href, text } = rows[key](value);
  el.href = href;
  el.querySelector(".value").textContent = text;
  el.setAttribute("aria-label", el.querySelector(".label").textContent + ": " + text);
  el.hidden = false;
}
</script>
</body>
</html>
